server.port=${PORT:8086}
spring.application.name=review-service
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

#Three lines below only runs when started in IDE, if started through docker, the environment variables gets injected into Spring automatically.
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

user.service.url=${USER_SERVICE_URL:http://localhost:8084/api/v1/users}

app.jwt.secret=${JWT_SECRET}
