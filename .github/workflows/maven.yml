name: Java CI/CD with Maven and Docker
#test
on:
  push:
    branches: ["main"]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # 3. Run tests
      - name: Run tests
        run: mvn -B test

      # 4. Build the Docker image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            viktornikander/review-service:latest
            viktornikander/review-service:${{ github.sha }}

      # 7. Redeploy on Railway
      - name: Redeploy on Railway
        run: npx -y @railway/cli@latest redeploy --service review-service --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_REVIEW_SERVICE }}